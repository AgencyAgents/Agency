name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

# Cancel stale runs on the same ref so only the latest commit's checks run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Typecheck tests
        run: bun run typecheck:test
      - name: Test (sharded)
        run: |
          bun test packages/schema packages/i18n packages/net packages/guard packages/telemetry packages/sdk
          bun test packages/providers
          bun test packages/tools
          bun test packages/core
          bun test packages/cli
      # The rpc/scripts shard runs one bun process per test file: a leaked
      # socket/timer in any single file used to wedge the whole shard on
      # Windows (bun never exits after the summary). The runner below gives
      # every file a fresh process with a 60s wall-clock timeout and
      # retries ONLY a Bun runtime crash ("Bun has crashed") or a timeout
      # — genuine assertion failures fail fast. Bun 1.4.0 segfaults
      # intermittently in its Windows TCP teardown when a test file's
      # socket churn collides with process exit (heap-layout dependent);
      # revisit when the Bun pin moves past the upstream fix.
      - name: Test (rpc shard, per-file)
        run: bun scripts/run-test-file.ts --timeout-ms 60000 --retries 2 packages/rpc/test scripts

  perf:
    name: perf budgets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Perf budgets (cold start, idle RSS, idle CPU)
        run: bun scripts/perf-check.ts

  claim-gate:
    name: doc claim gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Doc claims resolve to source
        run: bun scripts/doc-claims.ts
